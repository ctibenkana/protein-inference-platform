# Prometheus scrapes both containers of the embedding service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: embedding-service
  namespace: inference
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: embedding-service
  podMetricsEndpoints:
    - port: metrics # model server
      interval: 15s
    - port: gateway-metrics
      interval: 15s
