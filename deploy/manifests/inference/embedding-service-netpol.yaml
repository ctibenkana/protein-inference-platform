# Who may call the embedding service, on top of the namespace's default-deny
# ingress (platform-base); Prometheus scraping is allowed there for all pods.
# The model server listens on 127.0.0.1 inside the pod, so it needs no rule:
# it can't be reached over the network at all.
#
# The gateway's API is open to pods in this namespace (clients, the load
# generator). Access from outside the cluster comes with authentication,
# when the lab is onboarded.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-namespace
  namespace: inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: embedding-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
