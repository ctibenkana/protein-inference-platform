# Argo CD manages its own installation from the same pinned chart and values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.20.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/deploy/values/argo-cd.yaml
    - repoURL: https://github.com/ctibenkana/protein-inference-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # never let a bad commit delete the deployer itself
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
