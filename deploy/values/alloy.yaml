# Grafana Alloy as a single Deployment that tails pod logs through the
# Kubernetes API (no host mounts, works the same on kind and GKE).

controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.redact.receiver]
      }

      // Defence in depth for lab data: services must never log sequences,
      // but if a line contains a long run of amino-acid letters anyway,
      // drop it before it is stored. Drops are counted in Alloy's metrics.
      loki.process "redact" {
        // Count matches per source (namespace, pod, container labels of the
        // stream) so an alert can say who logged it. The match is extracted
        // only to drive the counter; it never becomes a label.
        stage.regex {
          expression = "(?P<possible_sequence>[ACDEFGHIKLMNPQRSTVWY]{30,})"
        }
        stage.metrics {
          metric.counter {
            name        = "possible_sequence_lines_total"
            description = "Log lines that look like a protein sequence, by source."
            source      = "possible_sequence"
            action      = "inc"
          }
        }
        stage.drop {
          expression          = "[ACDEFGHIKLMNPQRSTVWY]{30,}"
          drop_counter_reason = "possible_protein_sequence"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# Expose Alloy's own metrics (dropped lines, write errors) to Prometheus.
serviceMonitor:
  enabled: true
