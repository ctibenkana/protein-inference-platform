# kube-prometheus-stack, sized for one small system node.

# GKE manages the control plane, and Dataplane V2 replaces kube-proxy,
# so these targets can't be scraped there. Disabled everywhere for parity.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # Pick up ServiceMonitors / PodMonitors / rules from every namespace,
    # not only ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  # Notifications go to Discord. The webhook URL is a secret: it lives only
  # in the Kubernetes Secret alertmanager-discord (make discord-secret),
  # mounted as a file. If the Secret is missing, Alertmanager still runs;
  # it just can't deliver.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Heartbeat and helper alerts from kube-prometheus-stack: never notify.
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        # Informational alerts stay on dashboards.
        - receiver: "null"
          matchers: ['severity =~ "info|none"']
        # Critical: notify fast, remind hourly while unresolved.
        - receiver: discord
          matchers: ['severity = "critical"']
          group_wait: 10s
          repeat_interval: 1h
    inhibit_rules:
      # Don't also send the warning for something already critical.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]
      # The fast burn-rate alert covers the slow one.
      - source_matchers: ['alertname = "LogPipelineErrorBudgetBurnFast"']
        target_matchers: ['alertname = "LogPipelineErrorBudgetBurnSlow"']
      # kube-prometheus-stack's InfoInhibitor convention.
      - source_matchers: ['alertname = "InfoInhibitor"']
        target_matchers: ['severity = "info"']
        equal: [namespace]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/discord/webhook-url
            send_resolved: true
            title: '{{ template "discord.title" . }}'
            message: '{{ template "discord.message" . }}'
    templates:
      - /etc/alertmanager/config/*.tmpl
  templateFiles:
    discord.tmpl: |-
      {{ define "discord.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.severity }} ({{ . }}){{ end }}
      {{- end }}
      {{ define "discord.message" -}}
      {{ range .Alerts -}}
      {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} **{{ .Annotations.summary }}**
      {{ with .Annotations.description }}{{ . }}
      {{ end }}{{ with .Annotations.runbook_url }}Runbook: <{{ . }}>
      {{ end }}
      {{ end -}}
      {{- end }}
  alertmanagerSpec:
    volumes:
      - name: discord
        secret:
          secretName: alertmanager-discord
          optional: true
    volumeMounts:
      - name: discord
        mountPath: /etc/alertmanager/discord
        readOnly: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 192Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 96Mi }

grafana:
  # Credentials come from a Secret created outside git (`make grafana-secret`),
  # never from values. To be replaced by Secret Manager on GKE.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 384Mi }
  # Grafana builds its internal database on first start, which can take
  # minutes on a small node. Keep it on a volume so a restart doesn't
  # start over, and give the first start time before liveness checks.
  persistence:
    enabled: true
    size: 1Gi
  # The volume is ReadWriteOnce, so the old pod must stop before the new one
  # starts. maxSurge 0 does that without switching the type to Recreate,
  # which server-side apply rejects on an existing RollingUpdate Deployment.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 180
    timeoutSeconds: 30
    failureThreshold: 10
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
