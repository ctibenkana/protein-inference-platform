[package]
name = "gateway"
version = "0.1.0"
description = "Inference gateway for protein embeddings"
license = "Apache-2.0"
publish = false
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive", "env"] }
prometheus-client = "0.26.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
proptest = "1.12.0"
tower = { version = "0.5.3", features = ["util"] }

# Small, fast release binary for the container image.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
