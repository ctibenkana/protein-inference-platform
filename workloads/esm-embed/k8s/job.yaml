# One embedding run. Jobs are submitted on demand (make embed-job), not
# synced by Argo CD: a finished Job is a record of a run, not desired state.
# IMAGE is substituted at submit time.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: esm-embed-
  namespace: inference
  labels:
    app.kubernetes.io/name: esm-embed
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esm-embed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Prefer the spot worker pool on GKE; it tolerates the pool's taint.
      tolerations:
        - key: workload
          operator: Equal
          value: batch
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: pool
                    operator: In
                    values: ["workers"]
      containers:
        - name: esm-embed
          image: IMAGE
          args:
            - --input=/opt/samples/uniprot_human_300.fasta
            - --output=/out
            - --strategy=token_budget
            - --max-tokens=8192
            - --threads=2
            - --metrics-port=9100
            - --linger=45 # keep metrics up long enough for a final scrape
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: out, mountPath: /out }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: out
          emptyDir: {}
        - name: tmp
          emptyDir: {}
