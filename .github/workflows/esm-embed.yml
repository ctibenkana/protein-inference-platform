name: esm-embed

# Tests on every change; on main, publishes a signed multi-arch image tagged
# with the commit; on a tag esm-embed-vX.Y.Z, also publishes X.Y.Z and a
# GitHub release.

on:
  pull_request:
    paths:
      - "workloads/esm-embed/**"
      - ".github/workflows/esm-embed.yml"
  push:
    branches: [main]
    paths:
      - "workloads/esm-embed/**"
      - ".github/workflows/esm-embed.yml"
    tags: ["esm-embed-v*"]

permissions:
  contents: read

concurrency:
  group: esm-embed-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/esm-embed
  TORCH_VERSION: "2.15.0"

defaults:
  run:
    working-directory: workloads/esm-embed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install
        run: |
          pip install torch==${TORCH_VERSION} --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest==9.2.0
          pip install --no-deps -e .

      - name: test (including the real-model invariance test)
        run: pytest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing with Sigstore
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=esm-embed-v(\d+\.\d+\.\d+),group=1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: workloads/esm-embed
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: github.event_name != 'pull_request'

      - name: sign image (keyless, Sigstore)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### esm-embed image"
            echo "Digest: \`${DIGEST}\`"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Verify the signature:"
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/esm-embed.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/esm-embed-v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        working-directory: .
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes \
            "Container image: \`${IMAGE}:${TAG#esm-embed-v}\` (\`${DIGEST}\`), signed with Sigstore keyless signing. Built for linux/amd64 and linux/arm64, with SBOM and build provenance attached."
