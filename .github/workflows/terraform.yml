name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"

jobs:
  static:
    name: format, validate, lint, scan
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs, not tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/envs/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: security scan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  plan:
    name: plan (dev)
    needs: static
    runs-on: ubuntu-latest
    # Runs only once the GCP side is bootstrapped and repository
    # variables are set, so forks and fresh clones still pass CI.
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud via OIDC
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      # JSON list, e.g. [{"cidr_block":"203.0.113.10/32","display_name":"me"}]
      TF_VAR_authorized_networks: ${{ vars.TF_AUTHORIZED_NETWORKS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform plan
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -lock-timeout=2m -no-color -out=tfplan
          {
            echo '### terraform plan (dev)'
            echo '```'
            terraform show -no-color tfplan | tail -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
